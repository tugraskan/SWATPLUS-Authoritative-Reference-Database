name: sync-change-log

# Contributors don't say which file or record they changed, and don't fill
# in metadata/database_changes.csv by hand -- this workflow figures both out
# by diffing database_files/ against the PR's base commit (same approach
# scripts/validate_change_log.py's coverage check already uses) and writes
# the row(s) itself. The PR template's Reason/Source are the only human
# input, and both are optional: a PR with neither still gets a row.
#
# It also posts (or updates in place) a PR comment summarizing what was
# detected, so that's visible without digging into the Actions log.
#
# The PR body is untrusted user input: it is passed to the parser only via an
# `env:` variable, never interpolated into a shell `run:` string, so it can
# never be executed as a command.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0  # need base history to diff database_files/ against

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Diffs database_files/ against the PR's base commit to work out which
      # file(s)/record(s) changed and whether each was added/modified/removed,
      # then writes metadata/database_changes.csv itself. Output is captured
      # so the comment step below can relay it; it never contains the PR's
      # own free text, only file/record names and status words.
      - name: Sync change log from PR diff
        id: sync
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python scripts/sync_change_log_from_pr.py --repo-root . \
            --base-ref "${{ github.event.pull_request.base.sha }}" 2>&1 | tee sync_output.txt

      - name: Post result as a PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- sync-change-log-bot -->';
            let output = '';
            try { output = fs.readFileSync('sync_output.txt', 'utf8').trim(); } catch (e) { /* no output file */ }

            const outcome = '${{ steps.sync.outcome }}';
            const body = outcome === 'success'
              ? `${marker}\n🤖 **Change log:**\n\n${output}\n\nNothing else needed here -- \`metadata/database_changes.csv\` reflects this automatically. Reason/Source in the description above are optional extra context for reviewers.`
              : `${marker}\n⚠️ Something went wrong generating the change-log entry for this PR:\n\n${output}\n\nThis is likely a bug in the automation, not something to fix in your PR -- a maintainer should take a look.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Only same-repo branches can be pushed back to with this workflow's
      # token; a fork PR still gets the diff-based detection and comment
      # above, it just needs a maintainer to push the resulting row.
      - name: Commit updated change log
        if: steps.sync.outcome == 'success' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- metadata/database_changes.csv; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add metadata/database_changes.csv
            git commit -m "Sync change log for PR #${{ github.event.pull_request.number }}"
            git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
          else
            echo "Change log already in sync; nothing to commit."
          fi
