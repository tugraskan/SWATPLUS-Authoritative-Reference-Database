name: validate-database

# Self-contained validation. This workflow never clones or modifies SWAT+ or
# SWAT+ Editor, never builds SQLite, and never runs Editor integration tests.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need merge base for change-log coverage

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Validate authoritative files (manifest, duplicates, manure, provenance)
        run: python scripts/validate_database_files.py --repo-root .

      - name: Validate change log
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" || true
            python scripts/validate_change_log.py --repo-root . \
              --base-ref "origin/${{ github.base_ref }}"
          else
            python scripts/validate_change_log.py --repo-root .
          fi

      - name: Run unit tests
        run: python -m pytest -q
